# Loom — the test suite, on every platform Loom claims to support.
#
# Why this exists: Linux and Windows are a dual boot on one machine, so
# "reboot and check the other OS still passes" costs a real interruption and
# will not happen on every commit. The suite is headless and pure logic by
# design - no display, no QApplication, no game running - which makes it
# exactly the kind of thing a runner can answer instead.
#
# So this is the answer to "did the Windows work break Linux?", and it is a
# push rather than a reboot.

name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Do not stop the other legs when one fails. The whole value here is
      # seeing which platforms broke, and a cancelled Linux job answers
      # nothing.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # PyQt6 links against system libraries that a bare Linux runner does not
      # ship. The tests never open a window, but importing PyQt6.QtWidgets
      # still loads the platform plugin's dependencies, so they have to exist.
      - name: Qt's system libraries (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 \
            libdbus-1-3

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Tests
        # offscreen is Qt's no-display platform plugin. Without it, anything
        # that constructs a QApplication aborts on a runner with no X server;
        # with it, the same code runs headless.
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -q

  # Line endings are enforced by .gitattributes, but only for people whose git
  # applies it. This proves the committed bytes actually match the rule, so a
  # file committed from Windows with CRLF baked in cannot sit unnoticed until
  # the next Linux boot shows the whole tree as modified.
  line-endings:
    name: line endings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every text file is stored with LF
        run: |
          git add --renormalize .
          if ! git diff --cached --quiet; then
            echo "::error::These files are not stored with LF - see .gitattributes:"
            git diff --cached --name-only
            exit 1
          fi
          echo "All text files are stored with LF."
